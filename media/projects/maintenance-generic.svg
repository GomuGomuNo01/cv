<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <pattern id="hazard" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#0d0d0d"/>
      <rect width="14" height="28" fill="#ff6b35" fill-opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad5)"/>
  <g stroke="#ff6b35" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- bandeau de chantier (haut) -->
  <rect x="0" y="66" width="800" height="16" fill="url(#hazard)"/>

  <!-- engrenage -->
  <g transform="translate(400,222)">
    <g fill="#ff6b35">
      <rect x="-7" y="-80" width="14" height="24" rx="3"/>
      <rect x="-7" y="-80" width="14" height="24" rx="3" transform="rotate(45)"/>
      <rect x="-7" y="-80" width="14" height="24" rx="3" transform="rotate(90)"/>
      <rect x="-7" y="-80" width="14" height="24" rx="3" transform="rotate(135)"/>
      <rect x="-7" y="-80" width="14" height="24" rx="3" transform="rotate(180)"/>
      <rect x="-7" y="-80" width="14" height="24" rx="3" transform="rotate(225)"/>
      <rect x="-7" y="-80" width="14" height="24" rx="3" transform="rotate(270)"/>
      <rect x="-7" y="-80" width="14" height="24" rx="3" transform="rotate(315)"/>
    </g>
    <circle r="58" fill="none" stroke="#ff6b35" stroke-width="3"/>
    <circle r="22" fill="none" stroke="#ff6b35" stroke-width="3"/>
  </g>

  <g font-family="monospace" font-size="10" fill="#94a3b8" letter-spacing="2">
    <text x="400" y="332" text-anchor="middle">BUILD EN COURS</text>
  </g>
  <rect x="290" y="344" width="220" height="10" rx="5" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="292" y="346" width="138" height="6" rx="3" fill="#10e93b" fill-opacity="0.6"/>

  <!-- bandeau de chantier (bas) -->
  <rect x="0" y="364" width="800" height="16" fill="url(#hazard)"/>

  <text x="400" y="415" fill="#5a5a5a" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="3">PROJET EN COURS DE DÉVELOPPEMENT</text>
</svg>
