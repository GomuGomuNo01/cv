    <line x1="362" y1="134" x2="465" y2="134" stroke="#e5e9ee" stroke-width="2"/>
    <line x1="362" y1="148" x2="435" y2="148" stroke="#5a6270" stroke-width="1.5"/>
    <line x1="328" y1="175" x2="472" y2="175" stroke="#334155" stroke-width="1"/>
