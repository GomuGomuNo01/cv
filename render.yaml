# Déploiement Render en Static Site : gratuit, sans quota d'heures ni mise en
# veille (contrairement à un Web Service, limité à 750 h gratuites par mois
# pour l'ensemble des services). Django n'est utilisé qu'au moment du build :
# build_static.py génère le site dans _site, publié tel quel.
#
# Créer le service : Render > New > Static Site > dépôt GomuGomuNo01/cv,
# nom "cedric-kouadio-portfolio" (donne https://cedric-kouadio-portfolio.onrender.com),
# ou New > Blueprint pour appliquer ce fichier.
# La publication GitHub Pages (.github/workflows/pages.yml) reste disponible
# sous /cv/ ; ici le site est servi à la racine (SITE_BASE vide).
services:
  - type: web
    name: cedric-kouadio-portfolio
    runtime: static
    branch: main
    buildCommand: "pip install -r requirements.txt && python build_static.py"
    staticPublishPath: _site
    envVars:
      - key: SITE_BASE
        value: ""
      - key: PYTHON_VERSION
        value: 3.12.7
